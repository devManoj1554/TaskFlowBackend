server:
  port: ${PORT:5555}      # Dynamic port for Render
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

taskflow:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

cors:
  allowed-origins: ${CORS_ORIGINS:https://taskflowprowebapp.netlify.app}

logging:
  level:
    root: INFO
    com.taskflow: DEBUG
    #org.springframework.security: DEBUG
    #org.springframework.web: DEBUG