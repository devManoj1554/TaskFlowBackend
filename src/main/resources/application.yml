server:
  port: 5555
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/taskflow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Ram@786543210}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: true

taskflow:
  jwt:
    # Replace with at least 32 random bytes (base64 or plain) in production
    secret: ${JWT_SECRET:"change-me-please-use-a-long-random-string-of-at-least-32-bytes"}
    expiration-ms: 86400000  # 24h

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5555}

logging:
  level:
    root: INFO
    com.taskflow: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
