server:
  port: ${PORT:5555}            # Render dynamically provides this
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10       # Prevent Hibernate from exhausting connections
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

taskflow:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

cors:
  allowed-origins: ${CORS_ORIGINS:https://taskflowprowebapp.netlify.app}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info     # Expose /health for Render health check
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.taskflow: DEBUG